  <header class="site-header">

        <p>一覧から記事詳細へ移動できます</p>
      </div>
    </div>
    <div class="container site-head-inner">
      <a class="brand-link" href="index.html">
        <p class="brand-kicker">Lore Archive</p>
        <h1 class="brand-title">未回収設定・ロアアーカイブ</h1>
      </a>
      <p class="head-note">最新の記事から順に、一覧で確認できます。</p>

    <div class="site-nav-wrap">

    <div class="container page-stack">

        <p>新しく追加した記事から順に、1ページ10件ずつ表示します。</p>

            </div>
            <div id="paginationBottom" class="pagination pagination-bottom" aria-label="ページ送り"></div>
